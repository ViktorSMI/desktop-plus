name: Issue reader development workspace

on:
  push:
    branches: [fix/issue-reader-layout]
    paths: ['.github/workflows/issue-reader-development.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Export source and locked formatter for offline validation
        shell: bash
        run: |
          mkdir -p workspace
          git archive --format=tar.gz --output=workspace/source.tar.gz HEAD
          version=$(node -e 'const s = require("fs").readFileSync("yarn.lock", "utf8"); const m = s.match(/prettier@\^2\.6\.0:\r?\n\s+version "([^"]+)"/); if (!m) throw Error("Prettier lock entry missing"); console.log(m[1])')
          npm pack "prettier@${version}" --pack-destination workspace
      - uses: actions/upload-artifact@v7
        with:
          name: issue-reader-workspace
          path: workspace/*
          retention-days: 1
          if-no-files-found: error
