name: Cancel old workflow runs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cancel-old-runs.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cancel stale queued and running workflows
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RELEASE_RUN: '35402170052'
          KEEP_CI_RUN: '35402181834'
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail

          for status in queued in_progress; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" \
              | jq -r '.workflow_runs[].id' \
              | while read -r run_id; do
                  if [[ "${run_id}" == "${KEEP_RELEASE_RUN}" || \
                        "${run_id}" == "${KEEP_CI_RUN}" || \
                        "${run_id}" == "${CURRENT_RUN}" ]]; then
                    echo "Keeping run ${run_id}"
                    continue
                  fi

                  echo "Cancelling stale run ${run_id}"
                  code=$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}' \
                    -X POST \
                    -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")

                  if [[ "${code}" != "202" && "${code}" != "409" ]]; then
                    cat /tmp/cancel-response.txt
                    echo "Unexpected HTTP ${code} while cancelling ${run_id}" >&2
                    exit 1
                  fi
                done
          done

      - name: Remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cancel-old-runs.yml
          git commit -m "Remove temporary workflow canceller"
          git push origin HEAD:main
