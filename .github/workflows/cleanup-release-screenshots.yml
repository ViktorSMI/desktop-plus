name: Clean release screenshots

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-release-screenshots.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove screenshot assets from existing releases
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id tag; do
            assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")
            count=$(jq '[.[] | select(.name == "issue-reader-screenshots.zip" or (.name | endswith(".png")))] | length' <<<"$assets")

            if [ "$count" -eq 0 ]; then
              continue
            fi

            echo "Cleaning screenshot assets from $tag"

            gh release view "$tag" --json body --jq .body > /tmp/release-body.md
            python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/release-body.md')
          text = path.read_text(encoding='utf-8')
          for marker in ('\n### Issue discussion at', '\n### Last comment reached'):
              if marker in text:
                  text = text.split(marker, 1)[0]
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

            jq -r '.[] | select(.name == "issue-reader-screenshots.zip" or (.name | endswith(".png"))) | .id' <<<"$assets" |
            while read -r asset_id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done

            assets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")
            checksum_id=$(jq -r '.[] | select(.name == "SHA256SUMS.txt") | .id' <<<"$assets" | head -n1)
            if [ -n "$checksum_id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$checksum_id"
            fi

            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq '.[] | select(.name != "SHA256SUMS.txt" and .digest != null) | [(.digest | sub("^sha256:"; "")), .name] | @tsv' |
              sort |
              awk -F '\t' '{ print $1 "  " $2 }' > /tmp/SHA256SUMS.txt

            if [ -s /tmp/SHA256SUMS.txt ]; then
              gh release upload "$tag" /tmp/SHA256SUMS.txt --clobber
            fi

            gh release edit "$tag" --notes-file /tmp/release-body.md
          done
