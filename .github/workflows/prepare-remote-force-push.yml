name: Validate remote force push implementation

on:
  push:
    branches:
      - feature/remote-force-with-lease
    paths:
      - '.github/workflows/prepare-remote-force-push.yml'
      - '.github/remote-force-push.patch.gz'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Apply checked source patch
        shell: python
        run: |
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path

          patch = gzip.decompress(Path('.github/remote-force-push.patch.gz').read_bytes())
          expected = '9a433a2b64f6f6147262c6703ca228753fa786e51ee0ccefce4768f2238b3405'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Source patch hash mismatch')
          path = Path('/tmp/remote-force-push.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          component = Path('app/src/ui/rebase/confirm-force-push.tsx')
          text = component.read_text()
          field = '  private submitted = false\n\n'
          marker = '  public constructor(props: IConfirmForcePushProps) {'
          assert text.count(field) == 1 and text.count(marker) == 1
          component.write_text(text.replace(field, '').replace(marker, field + marker))

          test = Path('app/test/unit/ui/remote-force-push-dialog-test.tsx')
          text = test.read_text()
          text = text.replace("import { describe, it } from 'node:test'", "import { afterEach, beforeEach, describe, it } from 'node:test'")
          text = text.replace('import { fireEvent, render, screen, waitFor }', 'import { cleanup, fireEvent, render, screen, waitFor }')
          text = text.replace("import { ConfirmForcePush }", "import { DialogStackContext } from '../../../src/ui/dialog/dialog'\nimport { ConfirmForcePush }")
          text = text.replace('    <ConfirmForcePush\n', '    <DialogStackContext.Provider value={{ isTopMost: true }}>\n    <ConfirmForcePush\n')
          text = text.replace('    />\n  )', '    />\n    </DialogStackContext.Provider>\n  )')
          marker = "describe('remote force push confirmation', () => {\n"
          assert text.count(marker) == 1
          hooks = """
            let restorePlatformBridges: (() => void) | undefined

            beforeEach(async () => {
              // Keep the real dialog and controls; only replace Electron and native DOM bridges.
              const electron = await import('electron')
              const send = electron.ipcRenderer.send
              const prototype = HTMLDialogElement.prototype
              const showModal = Object.getOwnPropertyDescriptor(prototype, 'showModal')
              const close = Object.getOwnPropertyDescriptor(prototype, 'close')
              electron.ipcRenderer.send = () => {}
              prototype.showModal = function () {
                this.open = true
              }
              prototype.close = function () {
                this.open = false
              }
              restorePlatformBridges = () => {
                electron.ipcRenderer.send = send
                for (const [name, descriptor] of [
                  ['showModal', showModal],
                  ['close', close],
                ] as const) {
                  if (descriptor === undefined) {
                    Reflect.deleteProperty(prototype, name)
                  } else {
                    Object.defineProperty(prototype, name, descriptor)
                  }
                }
              }
            })

            afterEach(() => {
              try {
                cleanup()
              } finally {
                restorePlatformBridges?.()
                restorePlatformBridges = undefined
              }
            })
          """
          test.write_text(text.replace(marker, marker + hooks + '\n'))
          subprocess.run(['git', 'rm', '.github/remote-force-push.patch.gz', '.github/workflows/prepare-remote-force-push.yml'], check=True)

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: 24.19.0
          arch: x64

      - name: Format changed source with the locked project formatter
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(['git', 'add', '-N', 'app', 'docs'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--', 'app'], text=True).splitlines()
          paths = [p for p in paths if Path(p).suffix in ('.ts', '.tsx', '.scss')]
          subprocess.run(['node', 'node_modules/prettier/bin-prettier.js', '--write', *paths], check=True)
      - run: yarn lint
      - run: yarn validate-changelog
      - run: yarn test:setup
      - name: Test rewritten history, exact leases, and confirmation UI
        run: |
          node script/test.mjs \
            app/test/unit/git/remote-force-push-test.ts \
            app/test/unit/git/push-test.ts \
            app/test/unit/ui/remote-force-push-dialog-test.tsx
      - run: yarn compile:prod
      - name: Commit only the validated implementation
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs
          git commit -m 'Add confirmed remote-specific force push with pinned leases'
          git push origin HEAD:feature/remote-force-with-lease
