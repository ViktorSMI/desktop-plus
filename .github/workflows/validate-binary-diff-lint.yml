name: Validate binary diff lint

on:
  push:
    branches:
      - binary-diff-viewer

permissions:
  contents: write

jobs:
  lint-src:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: binary-diff-viewer
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: yarn
      - run: yarn
      - name: Run source lint and record result
        shell: bash
        run: |
          set +e
          yarn lint:src > /tmp/binary-diff-lint.log 2>&1
          status=$?
          {
            echo "exit=$status"
            tail -n 240 /tmp/binary-diff-lint.log
          } > .binary-diff-lint-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .binary-diff-lint-result.txt
          git commit -m "Record binary diff lint result"
          git push origin HEAD:binary-diff-viewer
          exit $status
