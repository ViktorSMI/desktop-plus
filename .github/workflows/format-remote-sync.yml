name: Format remote sync feature

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-remote-sync.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: yarn
      - run: yarn
      - name: Apply project Prettier
        run: |
          ./node_modules/.bin/prettier --write             app/src/lib/stores/app-store.ts             app/src/ui/branches/branches-container.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/lib/stores/app-store.ts app/src/ui/branches/branches-container.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Format two-remote sync feature'
            git push origin HEAD:main
          fi
