name: Validate Electron issue screenshots

on:
  push:
    branches: [test/issue-reader-screenshots]
    paths: ['.github/workflows/validate-issue-screenshots.yml']

permissions:
  contents: write

concurrency:
  group: validate-issue-screenshots
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 0.0.0
      SEMVER_COMPATIBLE_VERSION: 0.0.0
      RELEASE_CHANNEL: ''
      DESKTOP_E2E: '1'
      DESKTOP_SKIP_PACKAGE: '1'
      DESKTOP_E2E_APP_MODE: unpackaged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/issue-reader-screenshots
          submodules: recursive
      - name: Integrate screenshot tests with current issue dialog
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-reader-changes.{1,2,3,4}.gzpart | gzip -dc > /tmp/issue-reader.patch
          echo '7cc579478640ffef554d2affe580de91a420a59396d9427f8f9dd4ee44066dfd  /tmp/issue-reader.patch' | sha256sum --check
          git fetch --depth=1 origin 7704367f96725e7069e1b768035e849842ea01b4
          git worktree add --detach /tmp/reader-donor 7704367f96725e7069e1b768035e849842ea01b4
          git -C /tmp/reader-donor apply --check /tmp/issue-reader.patch
          git -C /tmp/reader-donor apply /tmp/issue-reader.patch
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          donor = Path('/tmp/reader-donor')
          paths = '''.github/workflows/ci.yml
          .github/workflows/issue-reader-ui.yml
          .gitignore
          app/app-info.ts
          app/src/lib/globals.d.ts
          app/src/ui/index.tsx
          app/test/globals.mts
          app/test/e2e/issue-reader-driver.ts
          app/test/e2e/issue-reader.e2e.ts
          app/test/e2e/playwright.config.ts
          app/test/unit/issue-comments-test.ts
          docs/testing/issue-reader-screenshots.md
          package.json'''.splitlines()
          paths = [p.strip() for p in paths]
          for name in paths:
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(donor / name, p)
          def edit(name, before, after):
              p = Path(name)
              s = p.read_text()
              if before not in s:
                  raise ValueError('Missing replacement in ' + name + ': ' + before[:80])
              p.write_text(s.replace(before, after))
          edit('app/test/e2e/issue-reader-driver.ts', '  interface Window {', '  // Augment the browser interface from lib.dom.d.ts.\n  // eslint-disable-next-line @typescript-eslint/naming-convention\n  interface Window {')
          edit('app/test/e2e/issue-reader-driver.ts', "import { Owner }", "import { Repository, RepositoryWithGitHubRepository } from '../../src/models/repository'\nimport { Owner }")
          edit('app/test/e2e/issue-reader-driver.ts', "event.target.id === 'issue-reader'", "event.target.id === 'issue-detail-dialog'")
          edit('app/test/e2e/issue-reader-driver.ts', 'type: PopupType.IssueReader,\n          repository,', "type: PopupType.IssueDetail,\n          repository: new Repository('issue-reader-e2e', -42, repository, false) as RepositoryWithGitHubRepository,")
          p = Path('app/test/e2e/issue-reader.e2e.ts')
          s = p.read_text().replace('#issue-reader', '#issue-detail-dialog').replace("name: 'Issue discussion'", "name: 'Issue description and comments'")
          s = s.replace("name: 'Show more comments', exact: true", "name: /^Show more comments/").replace('Unable to load this issue', 'Unable to load issue')
          s = s.replace('.issue-reader-status', '.issue-detail-status').replace('.issue-reader-title', '.issue-detail-title')
          s = s.replace('    const close = page\n', '    if (page.isClosed()) {\n      return\n    }\n    const close = page\n', 1)
          s = s.replace('    .toBe(true)\n  await expect(\n    page', '''    .toBe(true)
            for (const selector of ['.dialog-header .close', '.issue-reader-footer']) {
              await expect.poll(() => page.locator(`#issue-detail-dialog ${selector}`).evaluate(element => {
                const box = element.getBoundingClientRect()
                return box.left >= 0 && box.right <= innerWidth && box.bottom <= innerHeight
              })).toBe(true)
            }
            await expect(
              page''', 1)
          p.write_text(s)
          edit('app/webpack.common.ts', "        include: path.resolve(__dirname, 'src'),", "        include: [\n          path.resolve(__dirname, 'src'),\n          ...(process.env.DESKTOP_E2E === '1'\n            ? [path.resolve(__dirname, 'test/e2e/issue-reader-driver.ts')]\n            : []),\n        ],")
          p = Path('app/src/ui/lib/sandboxed-markdown.tsx')
          s = p.read_text()
          before = '  private readonly contentResizeObserver = new ResizeObserver(() => {\n    this.refreshHeight()\n  })'
          assert before in s
          s = s.replace(before, '  private heightUpdateFrame: number | null = null\n  private readonly contentResizeObserver = new ResizeObserver(() => {\n    if (this.heightUpdateFrame !== null) {\n      return\n    }\n    // Defer iframe height writes until after ResizeObserver layout delivery.\n    this.heightUpdateFrame = requestAnimationFrame(() => {\n      this.heightUpdateFrame = null\n      this.refreshHeight()\n    })\n  })')
          s = s.replace('    this.contentResizeObserver.disconnect()', '    this.stopObservingContent()')
          s = s.replace('  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {', '  private stopObservingContent = () => {\n    this.contentResizeObserver.disconnect()\n    if (this.heightUpdateFrame !== null) {\n      cancelAnimationFrame(this.heightUpdateFrame)\n      this.heightUpdateFrame = null\n    }\n  }\n\n  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {')
          p.write_text(s)
          edit('app/src/ui/branches/issue-detail-dialog.tsx', '  private onJumpToComments = () => {', '  private onJumpToDescription = () => {\n    this.scrollRef.current?.focus({ preventScroll: true })\n    this.scrollRef.current?.scrollTo({ top: 0 })\n  }\n\n  private onJumpToComments = () => {')
          edit('app/src/ui/branches/issue-detail-dialog.tsx', '<div className="issue-reader-toolbar-actions">', '<div className="issue-reader-toolbar-actions">\n              <Button onClick={this.onJumpToDescription} disabled={loading}>Description</Button>')
          p = Path('app/styles/ui/dialogs/_issue-detail.scss')
          s = p.read_text().replace('dialog#issue-detail-dialog {', 'dialog#issue-detail-dialog {\n  position: fixed;\n  inset: 32px 0 0;\n  margin: auto;\n  min-height: 0;\n  min-width: 0;\n  overflow: hidden;\n  > .dialog-header {\n    flex: 0 0 auto;\n    h1 { flex: 1; min-width: 0; width: auto; }\n    .close { margin-right: 0; }\n  }', 1)
          s = s.replace('    font-size: var(--font-size-lg);', '    font-size: 20px;')
          p.write_text(s)
          p = Path('app/src/ui/branches/issue-detail.tsx')
          s = p.read_text().replace('interface IIssueDetailProps {', 'const MarkdownStyles = `\n  body { overflow-wrap: anywhere; }\n  pre { max-width: 100%; overflow-x: auto; }\n  table { display: block; max-width: 100%; overflow-x: auto; }\n`\n\ninterface IIssueDetailProps {')
          s = s.replace('<SandboxedMarkdown\n', '<SandboxedMarkdown\n              customCSS={MarkdownStyles}\n')
          p.write_text(s)
          edit('.github/workflows/issue-reader-ui.yml', 'branches: [main, fix/issue-reader-layout]', 'branches: [main, test/issue-reader-screenshots]')
          edit('docs/testing/issue-reader-screenshots.md', 'IssueReader, styles', 'IssueDetailDialog, styles')
          paths += ['app/webpack.common.ts', 'app/src/ui/lib/sandboxed-markdown.tsx', 'app/src/ui/branches/issue-detail-dialog.tsx', 'app/src/ui/branches/issue-detail.tsx', 'app/styles/ui/dialogs/_issue-detail.scss']
          Path('/tmp/reader-files').write_text('\n'.join(paths) + '\n')
          PY
          git rm .github/issue-reader-changes.*.gzpart .github/workflows/validate-issue-screenshots.yml
          xargs -d '\n' git add -f -- < /tmp/reader-files
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-dev
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: 24.19.0
          arch: x64
      - name: Format and lint
        run: |
          xargs -d '\n' ./node_modules/.bin/prettier --write < /tmp/reader-files
          yarn lint
      - name: Preserve source for review
        run: |
          xargs -d '\n' git add -f -- < /tmp/reader-files
          git diff --cached --check
          mkdir -p /tmp/reader-export
          git diff --cached HEAD > /tmp/reader-export/validated-changes.patch
          tar -czf /tmp/reader-export/changed-source.tar.gz -T /tmp/reader-files
      - name: Test comment pagination
        run: yarn test:unit app/test/unit/issue-comments-test.ts
      - name: Build Electron
        run: yarn build:prod
      - name: Test UI and capture screenshots
        run: xvfb-run -a --server-args='-screen 0 1440x1000x24' yarn playwright test --config app/test/e2e/playwright.config.ts issue-reader.e2e.ts
      - name: Publish validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -f -- < /tmp/reader-files
          git diff --cached --check
          git commit -m 'Add real Electron issue screenshots and small-window regression checks'
          git push origin HEAD:test/issue-reader-screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: issue-reader-reviewed-source
          path: /tmp/reader-export/*
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ui-screenshots-Linux-x64
          path: playwright-results/**/*.png
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ui-test-report-Linux-x64
          path: |
            playwright-report/
            playwright-results/
            playwright-videos/
          retention-days: 14
          if-no-files-found: warn
