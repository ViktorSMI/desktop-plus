name: Validate issue reader changes

on:
  push:
    branches: [fix/issue-reader-layout]
    paths: ['.github/workflows/issue-reader-development.yml']

permissions:
  contents: write

concurrency:
  group: issue-reader-development
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 0.0.0
      SEMVER_COMPATIBLE_VERSION: 0.0.0
      RELEASE_CHANNEL: ''
      DESKTOP_E2E: '1'
      DESKTOP_SKIP_PACKAGE: '1'
      DESKTOP_E2E_APP_MODE: unpackaged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Apply reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-reader-changes.{1,2,3,4}.gzpart | gzip -dc > /tmp/issue-reader.patch
          echo '7cc579478640ffef554d2affe580de91a420a59396d9427f8f9dd4ee44066dfd  /tmp/issue-reader.patch' | sha256sum --check
          git apply --check /tmp/issue-reader.patch
          git apply /tmp/issue-reader.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/ui/branches/issue-detail.tsx')
          s = p.read_text().replace('componentDidUpdate(previous: IIssueReaderProps)', 'componentDidUpdate(prevProps: IIssueReaderProps)').replace('previous.repository.hash', 'prevProps.repository.hash').replace('previous.issueNumber', 'prevProps.issueNumber')
          s = s.replace('          tabIndex={0}', '          // The read-only scroll region must be focusable for PageDown/Home/End.\n          // eslint-disable-next-line jsx-a11y/no-noninteractive-tabindex\n          tabIndex={0}')
          p.write_text(s)
          p = Path('app/test/e2e/issue-reader-driver.ts')
          s = p.read_text().replace('  interface Window {', '  // Augment the native browser interface; its name is fixed by lib.dom.d.ts.\n  // eslint-disable-next-line @typescript-eslint/naming-convention\n  interface Window {')
          p.write_text(s)
          p = Path('app/webpack.common.ts')
          s = p.read_text().replace("        include: path.resolve(__dirname, 'src'),", "        include: [\n          path.resolve(__dirname, 'src'),\n          // Keep fixture code out of normal production builds.\n          ...(process.env.DESKTOP_E2E === '1'\n            ? [path.resolve(__dirname, 'test/e2e/issue-reader-driver.ts')]\n            : []),\n        ],", 1)
          p.write_text(s)
          p = Path('app/src/ui/lib/sandboxed-markdown.tsx')
          s = p.read_text().replace('  private readonly contentResizeObserver: ResizeObserver', '  private readonly contentResizeObserver: ResizeObserver\n  private heightUpdateFrame: number | null = null')
          s = s.replace('new ResizeObserver(this.refreshHeight)', 'new ResizeObserver(this.scheduleHeightUpdate)')
          s = s.replace('  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {', '  // A ResizeObserver callback runs during layout. Defer writes until the next\n  // frame so resizing an iframe cannot recursively invalidate that layout.\n  private scheduleHeightUpdate = () => {\n    if (this.heightUpdateFrame !== null) {\n      return\n    }\n    this.heightUpdateFrame = requestAnimationFrame(() => {\n      this.heightUpdateFrame = null\n      this.refreshHeight()\n    })\n  }\n\n  private stopObservingContent = () => {\n    this.contentResizeObserver.disconnect()\n    if (this.heightUpdateFrame !== null) {\n      cancelAnimationFrame(this.heightUpdateFrame)\n      this.heightUpdateFrame = null\n    }\n  }\n\n  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {')
          s = s.replace('    const oldDocument = this.frameRef.contentDocument\n    this.contentResizeObserver.disconnect()', '    const oldDocument = this.frameRef.contentDocument\n    this.stopObservingContent()')
          s = s.replace('  public componentWillUnmount() {\n    this.contentResizeObserver.disconnect()', '  public componentWillUnmount() {\n    this.stopObservingContent()')
          s = s.replace('    this.contentResizeObserver.disconnect()\n    this.contentResizeObserver.observe(doc.documentElement)', '    this.stopObservingContent()\n    this.contentResizeObserver.observe(doc.documentElement)')
          p.write_text(s)
          p = Path('app/styles/ui/dialogs/_issue-reader.scss')
          s = p.read_text().replace('  > .dialog-header {\n    flex: 0 0 auto;\n  }', '  > .dialog-header {\n    flex: 0 0 auto;\n\n    h1 {\n      flex: 1;\n      min-width: 0;\n      width: auto;\n    }\n\n    .close {\n      margin-right: 0;\n    }\n  }').replace('    font-size: var(--font-size-lg);', '    font-size: 20px;')
          p.write_text(s)
          p = Path('app/test/e2e/issue-reader.e2e.ts')
          s = p.read_text().replace('    const close = page\n', '    if (page.isClosed()) {\n      return\n    }\n    const close = page\n', 1)
          s = s.replace('    .toBe(true)\n  await expect(\n    page', '    .toBe(true)\n  for (const selector of [\'.dialog-header .close\', \'.dialog-footer\']) {\n    await expect\n      .poll(() =>\n        page.locator(`#issue-reader ${selector}`).evaluate(element => {\n          const box = element.getBoundingClientRect()\n          return box.left >= 0 && box.right <= innerWidth && box.bottom <= innerHeight\n        })\n      )\n      .toBe(true)\n  }\n  await expect(\n    page', 1)
          p.write_text(s)
          PY
          git rm .github/issue-reader-changes.*.gzpart .github/workflows/issue-reader-development.yml
          git add --dry-run -f .github/workflows/issue-reader-ui.yml docs/testing/issue-reader-screenshots.md
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-dev
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: 24.19.0
          arch: x64
      - name: Format reviewed adjustments
        run: yarn prettier --write app/src/ui/lib/sandboxed-markdown.tsx app/styles/ui/dialogs/_issue-reader.scss app/test/e2e/issue-reader.e2e.ts
      - name: Check project formatting and lint
        run: yarn lint
      - name: Test comment pagination
        run: yarn test:unit app/test/unit/issue-comments-test.ts
      - name: Build the real Electron app
        run: yarn build:prod
      - name: Exercise UI and capture screenshots
        run: xvfb-run -a --server-args='-screen 0 1440x1000x24' yarn playwright test --config app/test/e2e/playwright.config.ts issue-reader.e2e.ts
      - name: Commit validated changes to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            .github/workflows/ci.yml \
            .github/workflows/issue-reader-ui.yml \
            .github/workflows/release-v3.6.6-beta3.yml \
            .gitignore \
            app/app-info.ts \
            app/src/lib/api.ts \
            app/src/lib/globals.d.ts \
            app/src/models/popup.ts \
            app/src/ui/app.tsx \
            app/src/ui/branches/branches-container.tsx \
            app/src/ui/branches/issue-detail.tsx \
            app/src/ui/branches/issue-list.tsx \
            app/src/ui/index.tsx \
            app/src/ui/lib/sandboxed-markdown.tsx \
            app/styles/ui/_branches.scss \
            app/styles/ui/_dialog.scss \
            app/styles/ui/dialogs/_issue-reader.scss \
            app/test/e2e/issue-reader-driver.ts \
            app/test/e2e/issue-reader.e2e.ts \
            app/test/e2e/playwright.config.ts \
            app/test/globals.mts \
            app/test/unit/issue-comments-test.ts \
            app/webpack.common.ts \
            docs/testing/issue-reader-screenshots.md \
            package.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Fix issue reader layout and add real UI screenshot tests'
          git push origin HEAD:fix/issue-reader-layout
      - name: Upload UI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-Linux-x64
          path: playwright-results/**/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Upload HTML report and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-report-Linux-x64
          path: |
            playwright-report/
            playwright-results/
            playwright-videos/
          retention-days: 14
          if-no-files-found: warn
