name: Apply validated updater sources

on:
  push:
    branches:
      - feature/fork-auto-updates
    paths:
      - '.github/workflows/apply-fork-updater.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify and apply source patch
        shell: python
        run: |
          import base64
          import gzip
          import hashlib
          import subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/updater-patch-{i}.b64').read_text() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = 'f275c9613ffbd2a19737721f99b51c1b58a74ebe69f7a6d9b7ac510c020b5c89'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Source patch hash mismatch')
          path = Path('/tmp/fork-updater.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Format source using locked project Prettier
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.run(['git', 'add', '-N', 'app', 'script', 'docs'], check=True)
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--', 'app', 'script', 'docs'], text=True).splitlines()
          paths = [p for p in paths if Path(p).suffix in ('.ts', '.tsx', '.js', '.mjs', '.json', '.scss')]
          subprocess.run(['node', 'node_modules/prettier/bin-prettier.js', '--write', *paths], check=True)
      - name: Commit updater implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app script docs
          git rm .github/updater-patch-*.b64
          git commit -m 'Implement fork-pinned updates with verified Windows packages'
          git push origin HEAD:feature/fork-auto-updates
      - run: yarn lint
      - run: node script/test.mjs app/test/unit/fork-updater-test.ts
      - run: python script/create-update-manifest-test.py
