name: Release 3.6.6-beta3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v3.6.6-beta3.yml'

env:
  NODE_VERSION: 24.19.0
  APP_VERSION: 3.6.6-beta3
  SEMVER_COMPATIBLE_VERSION: 3.6.6-beta3
  # Keep this empty: dist-info.ts intentionally has no update URL, and
  # production/beta packaging would otherwise try to build Squirrel deltas
  # from an empty remote URL.
  RELEASE_CHANNEL: ''

jobs:
  build:
    name: Build ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-latest]
        arch: [x64, arm64]
        include:
          - os: macos-14
            friendlyName: macOS
          - os: windows-2022
            friendlyName: Windows
          - os: ubuntu-latest
            friendlyName: Linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Validate macOS version
        if: runner.os == 'macOS'
        run: yarn validate-macos-version

      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          DESKTOP_OAUTH_CLIENT_ID_BITBUCKET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_ID_GITLAB:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_GITLAB }}
          DESKTOP_OAUTH_CLIENT_SECRET_GITLAB:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_GITLAB }}
          DESKTOP_OAUTH_CLIENT_ID_CODEBERG:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_CODEBERG }}
          DESKTOP_OAUTH_CLIENT_SECRET_CODEBERG:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_CODEBERG }}
          DESKTOP_OAUTH_CLIENT_ID_GITEA:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_GITEA }}
          DESKTOP_OAUTH_CLIENT_SECRET_GITEA:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_GITEA }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}

      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: 'false'

      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.friendlyName }}-${{ matrix.arch }}
          path: |
            dist/*-macOS-*.zip
            dist/*.exe
            dist/*.msi
            dist/*.nupkg
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: './artifacts'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.6-beta3
          target_commitish: main
          name: Desktop Plus 3.6.6-beta3
          body: |
            ## What's new

            - Added an in-app hexadecimal diff viewer for binary files.
            - Added a read-only Issues tab next to Branches and Pull Requests.
            - Issues can be opened inside Desktop Plus with Markdown descriptions and comments.
            - Issue browsing supports GitHub, GitLab, Gitea, Forgejo and Codeberg through the existing provider abstraction.
            - Fixed GitHub issue fetching so pull requests are excluded from the issue list.

            This is a beta release.
          files: |
            artifacts/**/DesktopPlus-*.AppImage
            artifacts/**/DesktopPlus-*.AppImage.zsync
            artifacts/**/DesktopPlus-*.deb
            artifacts/**/DesktopPlus-*.rpm
            artifacts/**/DesktopPlus-*.exe
            artifacts/**/DesktopPlus-*.msi
            artifacts/**/DesktopPlus-*.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
