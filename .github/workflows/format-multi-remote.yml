name: Format multi-remote feature

on:
  push:
    branches:
      - feature/multi-remote-switcher
    paths:
      - '.github/workflows/format-multi-remote.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: yarn
      - run: yarn
      - name: Apply project Prettier
        run: |
          ./node_modules/.bin/prettier --write \
            app/src/ui/branches/branches-container.tsx \
            app/src/ui/dispatcher/dispatcher.ts \
            app/src/lib/stores/app-store.ts \
            app/src/ui/branches/group-branches.ts \
            app/src/ui/branches/index.ts \
            app/styles/ui/_branches.scss \
            app/test/unit/group-branches-test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/ui/branches/branches-container.tsx \
            app/src/ui/dispatcher/dispatcher.ts \
            app/src/lib/stores/app-store.ts \
            app/src/ui/branches/group-branches.ts \
            app/src/ui/branches/index.ts \
            app/styles/ui/_branches.scss \
            app/test/unit/group-branches-test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Apply project formatting'
            git push origin HEAD:feature/multi-remote-switcher
          fi
