name: Temporary binary diff formatter

on:
  push:
    branches:
      - feature/binary-diff-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/binary-diff-v2
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: >
          yarn prettier --write
          app/src/lib/binary-diff.ts
          app/src/lib/git/diff.ts
          app/src/ui/diff/binary-file.tsx
          app/test/unit/binary-diff-test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lib/binary-diff.ts app/src/lib/git/diff.ts app/src/ui/diff/binary-file.tsx app/test/unit/binary-diff-test.ts
          git commit -m "Format binary diff changes [skip format]"
          git push origin HEAD:feature/binary-diff-v2
