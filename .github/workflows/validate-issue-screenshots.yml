name: Validate Electron issue screenshots

on:
  push:
    branches: [test/issue-reader-screenshots]
    paths: ['.github/workflows/validate-issue-screenshots.yml']

permissions:
  contents: write

concurrency:
  group: validate-issue-screenshots
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION: 0.0.0
      SEMVER_COMPATIBLE_VERSION: 0.0.0
      RELEASE_CHANNEL: ''
      DESKTOP_E2E: '1'
      DESKTOP_SKIP_PACKAGE: '1'
      DESKTOP_E2E_APP_MODE: unpackaged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/issue-reader-screenshots
          submodules: recursive
      - name: Integrate tested reader without changing release configuration
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-reader-changes.{1,2,3,4}.gzpart | gzip -dc > /tmp/issue-reader.patch
          echo '7cc579478640ffef554d2affe580de91a420a59396d9427f8f9dd4ee44066dfd  /tmp/issue-reader.patch' | sha256sum --check
          git fetch --depth=1 origin 7704367f96725e7069e1b768035e849842ea01b4
          git worktree add --detach /tmp/reader-donor 7704367f96725e7069e1b768035e849842ea01b4
          git -C /tmp/reader-donor apply --check /tmp/issue-reader.patch
          git -C /tmp/reader-donor apply /tmp/issue-reader.patch
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          donor = Path('/tmp/reader-donor')
          paths = '''.github/workflows/ci.yml
          .github/workflows/issue-reader-ui.yml
          .gitignore
          app/app-info.ts
          app/src/lib/globals.d.ts
          app/src/ui/index.tsx
          app/src/ui/lib/sandboxed-markdown.tsx
          app/test/globals.mts
          app/test/e2e/issue-reader-driver.ts
          app/test/e2e/issue-reader.e2e.ts
          app/test/e2e/playwright.config.ts
          app/test/unit/issue-comments-test.ts
          docs/testing/issue-reader-screenshots.md
          package.json'''.splitlines()
          paths = [p.strip() for p in paths]
          for name in paths:
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(donor / name, p)
          p = Path('app/src/ui/branches/issue-detail-dialog.tsx')
          s = (donor / 'app/src/ui/branches/issue-detail.tsx').read_text()
          s = s.replace('IssueReader', 'IssueDetailDialog').replace('IIssueReader', 'IIssueDetailDialog').replace('id="issue-reader"', 'id="issue-detail-dialog"')
          s = s.replace('componentDidUpdate(previous: IIssueDetailDialogProps)', 'componentDidUpdate(prevProps: IIssueDetailDialogProps)').replace('previous.repository.hash', 'prevProps.repository.hash').replace('previous.issueNumber', 'prevProps.issueNumber')
          s = s.replace('          tabIndex={0}', '          // The read-only scroll region supports keyboard scrolling.\n          // eslint-disable-next-line jsx-a11y/no-noninteractive-tabindex\n          tabIndex={0}')
          p.write_text(s)
          p = Path('app/test/e2e/issue-reader-driver.ts')
          s = p.read_text().replace('  interface Window {', '  // Augment the browser interface from lib.dom.d.ts.\n  // eslint-disable-next-line @typescript-eslint/naming-convention\n  interface Window {')
          s = s.replace("event.target.id === 'issue-reader'", "event.target.id === 'issue-detail-dialog'").replace('PopupType.IssueReader', 'PopupType.IssueDetail')
          p.write_text(s)
          p = Path('app/webpack.common.ts')
          s = p.read_text().replace("        include: path.resolve(__dirname, 'src'),", "        include: [\n          path.resolve(__dirname, 'src'),\n          ...(process.env.DESKTOP_E2E === '1'\n            ? [path.resolve(__dirname, 'test/e2e/issue-reader-driver.ts')]\n            : []),\n        ],", 1)
          p.write_text(s)
          p = Path('app/src/ui/lib/sandboxed-markdown.tsx')
          s = p.read_text().replace('  private readonly contentResizeObserver: ResizeObserver', '  private readonly contentResizeObserver: ResizeObserver\n  private heightUpdateFrame: number | null = null')
          s = s.replace('new ResizeObserver(this.refreshHeight)', 'new ResizeObserver(this.scheduleHeightUpdate)')
          s = s.replace('  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {', '  // Defer iframe height writes until after ResizeObserver layout delivery.\n  private scheduleHeightUpdate = () => {\n    if (this.heightUpdateFrame !== null) {\n      return\n    }\n    this.heightUpdateFrame = requestAnimationFrame(() => {\n      this.heightUpdateFrame = null\n      this.refreshHeight()\n    })\n  }\n\n  private stopObservingContent = () => {\n    this.contentResizeObserver.disconnect()\n    if (this.heightUpdateFrame !== null) {\n      cancelAnimationFrame(this.heightUpdateFrame)\n      this.heightUpdateFrame = null\n    }\n  }\n\n  private onFrameRef = (frameRef: HTMLIFrameElement | null) => {')
          s = s.replace('    const oldDocument = this.frameRef.contentDocument\n    this.contentResizeObserver.disconnect()', '    const oldDocument = this.frameRef.contentDocument\n    this.stopObservingContent()')
          s = s.replace('  public componentWillUnmount() {\n    this.contentResizeObserver.disconnect()', '  public componentWillUnmount() {\n    this.stopObservingContent()')
          s = s.replace('    this.contentResizeObserver.disconnect()\n    this.contentResizeObserver.observe(doc.documentElement)', '    this.stopObservingContent()\n    this.contentResizeObserver.observe(doc.documentElement)')
          p.write_text(s)
          p = Path('app/styles/ui/dialogs/_issue-detail.scss')
          s = (donor / 'app/styles/ui/dialogs/_issue-reader.scss').read_text().replace('#issue-reader', '#issue-detail-dialog')
          s = s.replace('  > .dialog-header {\n    flex: 0 0 auto;\n  }', '  > .dialog-header {\n    flex: 0 0 auto;\n    h1 { flex: 1; min-width: 0; width: auto; }\n    .close { margin-right: 0; }\n  }').replace('    font-size: var(--font-size-lg);', '    font-size: 20px;')
          p.write_text(p.read_text() + '\n' + s)
          p = Path('app/test/e2e/issue-reader.e2e.ts')
          s = p.read_text().replace('#issue-reader', '#issue-detail-dialog')
          s = s.replace('    const close = page\n', '    if (page.isClosed()) {\n      return\n    }\n    const close = page\n', 1)
          s = s.replace('    .toBe(true)\n  await expect(\n    page', '''    .toBe(true)
            for (const selector of ['.dialog-header .close', '.dialog-footer']) {
              await expect.poll(() => page.locator(`#issue-detail-dialog ${selector}`).evaluate(element => {
                const box = element.getBoundingClientRect()
                return box.left >= 0 && box.right <= innerWidth && box.bottom <= innerHeight
              })).toBe(true)
            }
            await expect(
              page''', 1)
          p.write_text(s)
          p = Path('.github/workflows/issue-reader-ui.yml')
          p.write_text(p.read_text().replace('branches: [main, fix/issue-reader-layout]', 'branches: [main, test/issue-reader-screenshots]'))
          p = Path('docs/testing/issue-reader-screenshots.md')
          p.write_text(p.read_text().replace('IssueReader, styles', 'IssueDetailDialog, styles'))
          paths += ['app/webpack.common.ts', 'app/src/ui/branches/issue-detail-dialog.tsx', 'app/styles/ui/dialogs/_issue-detail.scss']
          Path('/tmp/reader-files').write_text('\n'.join(paths) + '\n')
          PY
          git rm .github/issue-reader-changes.*.gzpart .github/workflows/validate-issue-screenshots.yml
          xargs -d '\n' git add -f -- < /tmp/reader-files
      - name: Install Electron display dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libsecret-1-dev
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: 24.19.0
          arch: x64
      - name: Format and lint
        run: |
          xargs -d '\n' ./node_modules/.bin/prettier --write --ignore-unknown < /tmp/reader-files
          yarn lint
      - name: Preserve source for review
        run: |
          xargs -d '\n' git add -f -- < /tmp/reader-files
          git diff --cached --check
          mkdir -p /tmp/reader-export
          git diff --cached HEAD > /tmp/reader-export/validated-changes.patch
          tar -czf /tmp/reader-export/changed-source.tar.gz -T /tmp/reader-files
      - name: Test comment pagination
        run: yarn test:unit app/test/unit/issue-comments-test.ts
      - name: Build Electron
        run: yarn build:prod
      - name: Test UI and capture screenshots
        run: xvfb-run -a --server-args='-screen 0 1440x1000x24' yarn playwright test --config app/test/e2e/playwright.config.ts issue-reader.e2e.ts
      - name: Publish validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -f -- < /tmp/reader-files
          git diff --cached --check
          git commit -m 'Add real Electron issue screenshots and small-window regression checks'
          git push origin HEAD:test/issue-reader-screenshots
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: issue-reader-reviewed-source
          path: /tmp/reader-export/*
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ui-screenshots-Linux-x64
          path: playwright-results/**/*.png
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ui-test-report-Linux-x64
          path: |
            playwright-report/
            playwright-results/
            playwright-videos/
          retention-days: 14
          if-no-files-found: warn
