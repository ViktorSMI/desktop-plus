name: Ordinary pull reconciliation validation

on:
  push:
    branches:
      - work/pull-reconciliation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
          submodules: recursive
          persist-credentials: false
      - name: Apply the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          echo '540d6ed836549f1940823e42dfc0657371a7d179822719086366239d07923e09  script/pull-reconciliation.patch.gz' | sha256sum --check
          gzip -dc script/pull-reconciliation.patch.gz > /tmp/reconciliation.patch
          git apply --index /tmp/reconciliation.patch
          mkdir -p /tmp/reconciliation-validation
          git diff --cached --name-only > /tmp/reconciliation-validation/paths.txt
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: '24.19.0'
          arch: x64
      - name: Prepare project test environment
        run: yarn test:setup
      - name: Format and record the candidate sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/reconciliation-validation/paths.txt
          node node_modules/prettier/bin-prettier.js --ignore-unknown --write "${FILES[@]}"
          for file in "${FILES[@]}"; do
            mkdir -p "/tmp/reconciliation-validation/source/$(dirname "$file")"
            cp "$file" "/tmp/reconciliation-validation/source/$file"
            echo "$(git hash-object "$file") $file" >> /tmp/reconciliation-validation/tested-blobs.txt
          done
      - name: Test toolbar, Git reconciliation and safety
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          node script/test.mjs app/test/unit/ui/push-pull-safety-test.tsx app/test/unit/main-process/push-command-safety-test.ts app/test/unit/git/pull app/test/unit/git/push-test.ts app/test/unit/git/remote-force-push-test.ts app/test/unit/ui/remote-force-push-dialog-test.tsx app/test/unit/commit-actions-*-test.ts app/test/unit/commit-actions-*-test.tsx app/test/unit/commit-actions-test.ts 2>&1 | tee /tmp/reconciliation-validation/tests.log
      - name: Save early test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pull-reconciliation-tests
          path: /tmp/reconciliation-validation/tests.log
          retention-days: 7
      - name: Verify old toolbar fails reconciliation regressions
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/ui/toolbar/push-pull-button.tsx
          cp "$FILE" /tmp/reconciliation-toolbar.tsx
          trap 'cp /tmp/reconciliation-toolbar.tsx "$FILE"' EXIT
          git show da941df3622c382a7afaffa7e2db79b70ee84486:"$FILE" > "$FILE"
          CODE=0
          timeout 120s env -u GITHUB_ACTIONS node script/test.mjs --test-name-pattern='never force pushes with amended or rebased published history|never force pushes with rewritten history with configured rebase|reconciles rewritten history through Pull' app/test/unit/ui/push-pull-safety-test.tsx > /tmp/reconciliation-validation/before-tests.log 2>&1 || CODE=$?
          cat /tmp/reconciliation-validation/before-tests.log
          test "$CODE" -eq 1
          grep -E 'fail 3$' /tmp/reconciliation-validation/before-tests.log
      - name: Lint and validate changelog
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          yarn lint 2>&1 | tee /tmp/reconciliation-validation/lint.log
          yarn validate-changelog
      - name: Production compilation and typecheck
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          yarn compile:prod 2>&1 | tee /tmp/reconciliation-validation/compile.log
      - name: Save verification evidence and exact sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pull-reconciliation-validation
          path: /tmp/reconciliation-validation
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  blobs:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pull-reconciliation-validation
          path: verified
      - name: Store verified source blobs without updating branches or tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('verified/source')
          expected_paths = {
              '.github/beta-version', '.github/beta-release-notes.md',
              'app/src/ui/toolbar/push-pull-button.tsx',
              'app/test/unit/ui/push-pull-safety-test.tsx',
              'app/test/unit/git/pull/pull-reconciliation-test.ts',
          }
          lines = pathlib.Path('verified/tested-blobs.txt').read_text().splitlines()
          assert {line.split(' ', 1)[1] for line in lines} == expected_paths
          assert len(lines) == len(expected_paths)
          records = []
          for line in lines:
              expected, name = line.split(' ', 1)
              data = root.joinpath(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, name
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == expected, name
              records.append({'path': name, 'sha': expected, 'mode': '100644', 'type': 'blob'})
          pathlib.Path('git-blobs.json').write_text(json.dumps(records, indent=2) + '\n')
      - uses: actions/upload-artifact@v7
        with:
          name: pull-reconciliation-blobs
          path: git-blobs.json
          retention-days: 7
          if-no-files-found: error
