name: Fix updater integration contracts

on:
  push:
    branches:
      - feature/fork-auto-updates
    paths:
      - '.github/workflows/fix-updater-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Align the updater with the IPC and return contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/test/unit/ipc-contract-test.ts')
          text = path.read_text()
          before = "    'auto-updater-error',\n"
          assert text.count(before) == 1
          path.write_text(text.replace(before, "    'fork-update-manual',\n" + before))

          path = Path('app/src/ui/app.tsx')
          text = path.read_text()
          before = '      return updateStore.checkForUpdates(inBackground, skipGuidCheck)'
          assert text.count(before) == 1
          path.write_text(text.replace(before, '      updateStore.checkForUpdates(inBackground, skipGuidCheck)'))
      - name: Commit the integration fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/test/unit/ipc-contract-test.ts app/src/ui/app.tsx
          git commit -m 'Align updater IPC and return type contracts'
          git push origin HEAD:feature/fork-auto-updates
