name: Validate binary diff

on:
  push:
    branches:
      - feature/binary-diff-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: '24.19.0'
          arch: x64
      - name: Check formatting
        run: >
          ./node_modules/.bin/prettier --check
          app/src/lib/binary-diff.ts
          app/src/lib/git/diff.ts
          app/src/models/diff/diff-data.ts
          app/src/ui/diff/binary-file.tsx
          app/styles/ui/_diff.scss
          app/test/unit/binary-diff-test.ts
          app/test/unit/stores/updates/update-changed-files-test.ts
      - name: Check TypeScript lint
        run: >
          ./node_modules/.bin/eslint --rulesdir ./eslint-rules
          app/src/lib/binary-diff.ts
          app/src/lib/git/diff.ts
          app/src/models/diff/diff-data.ts
          app/src/ui/diff/binary-file.tsx
          app/test/unit/binary-diff-test.ts
          app/test/unit/stores/updates/update-changed-files-test.ts
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          DESKTOP_OAUTH_CLIENT_ID_BITBUCKET: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET: ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_BITBUCKET }}
          DESKTOP_OAUTH_CLIENT_ID_GITLAB: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID_GITLAB }}
          DESKTOP_OAUTH_CLIENT_SECRET_GITLAB: ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET_GITLAB }}
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Prepare tests
        run: yarn test:setup
        env:
          npm_config_arch: x64
      - name: Run unit tests
        run: yarn test:unit
